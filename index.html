<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculatrice GO</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 20%, #1a1a2e, #0f0f1a);
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
        }

        /* ── Conteneur principal avec effet glass ── */
        .calculator {
            position: relative;
            width: 100%;
            max-width: 380px;
            padding: 2rem 1.8rem 2.2rem;
            border-radius: 2.8rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .calculator:hover {
            transform: translateY(-4px);
        }

        /* ── En-tête : Nom de l'app + Auteur ── */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding: 0 0.2rem 0.6rem 0.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .app-name {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-author {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.2rem 0.9rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
        }

        /* ── Écran ── */
        .display {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 1.8rem;
            padding: 1.2rem 1.8rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 8px 12px rgba(0, 0, 0, 0.3);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }

        .display .expression {
            font-size: 1.1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.3px;
            min-height: 1.8rem;
            word-break: break-all;
            text-align: right;
            width: 100%;
            transition: color 0.2s;
        }

        .display .result {
            font-size: 3.2rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
            line-height: 1.2;
            transition: all 0.2s ease;
            word-break: break-all;
            text-align: right;
            width: 100%;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .display .result.shrink {
            font-size: 2.4rem;
        }

        /* ── Grille des touches ── */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }

        /* ── Style général des boutons ── */
        .btn {
            position: relative;
            padding: 1.2rem 0;
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            border: none;
            border-radius: 1.6rem;
            background: rgba(255, 255, 255, 0.06);
            color: #eaeef2;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.93);
        }

        /* ── Boutons numériques ── */
        .btn-number {
            background: rgba(255, 255, 255, 0.07);
            color: #f0f4f8;
        }

        .btn-number:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .btn-number:active {
            background: rgba(255, 255, 255, 0.20);
        }

        /* ── Opérateurs ── */
        .btn-operator {
            background: rgba(99, 102, 241, 0.20);
            color: #a5b4fc;
            font-weight: 600;
        }

        .btn-operator:hover {
            background: rgba(99, 102, 241, 0.32);
        }

        .btn-operator:active {
            background: rgba(99, 102, 241, 0.45);
        }

        /* ── Bouton égal (accent) ── */
        .btn-equal {
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            color: #fff;
            font-weight: 700;
            font-size: 1.8rem;
            box-shadow:
                0 6px 16px rgba(99, 102, 241, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .btn-equal:hover {
            background: linear-gradient(145deg, #818cf8, #6366f1);
            box-shadow:
                0 8px 24px rgba(99, 102, 241, 0.50),
                inset 0 1px 0 rgba(255, 255, 255, 0.20);
            transform: translateY(-2px);
        }

        .btn-equal:active {
            transform: scale(0.93) translateY(0);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.30);
        }

        /* ── Effacement / fonctions ── */
        .btn-function {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            font-weight: 500;
        }

        .btn-function:hover {
            background: rgba(239, 68, 68, 0.26);
        }

        .btn-function:active {
            background: rgba(239, 68, 68, 0.38);
        }

        .btn-function-clear {
            background: rgba(239, 68, 68, 0.22);
            color: #f87171;
        }

        .btn-function-clear:hover {
            background: rgba(239, 68, 68, 0.36);
        }

        /* ── Bouton pourcentage ── */
        .btn-percent {
            background: rgba(251, 191, 36, 0.12);
            color: #fcd34d;
        }

        .btn-percent:hover {
            background: rgba(251, 191, 36, 0.22);
        }

        /* ── Bouton point ── */
        .btn-dot {
            background: rgba(255, 255, 255, 0.06);
            color: #eaeef2;
        }

        .btn-dot:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        /* ── Rendre le bouton 0 plus large ── */
        .btn-zero {
            grid-column: span 2;
        }

        /* ── Petite touche "signe" ( ± ) ── */
        .btn-sign {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            font-size: 1.2rem;
        }

        .btn-sign:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ── Animation d'apparition ── */
        .calculator {
            animation: floatUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes floatUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 420px) {
            .calculator {
                padding: 1.5rem 1.2rem 1.8rem;
                border-radius: 2.2rem;
            }
            .display .result {
                font-size: 2.8rem;
            }
            .display .result.shrink {
                font-size: 2rem;
            }
            .btn {
                font-size: 1.3rem;
                padding: 1rem 0;
                border-radius: 1.4rem;
            }
            .btn-equal {
                font-size: 1.6rem;
            }
            .buttons {
                gap: 0.6rem;
            }
            .app-name {
                font-size: 0.9rem;
            }
            .app-author {
                font-size: 0.6rem;
                padding: 0.1rem 0.6rem;
            }
        }

        @media (max-width: 360px) {
            .calculator {
                padding: 1.2rem 0.9rem 1.4rem;
                border-radius: 1.8rem;
            }
            .display {
                padding: 0.8rem 1.2rem;
                min-height: 90px;
                border-radius: 1.4rem;
            }
            .display .result {
                font-size: 2.2rem;
            }
            .btn {
                font-size: 1.1rem;
                padding: 0.8rem 0;
                border-radius: 1.2rem;
            }
            .buttons {
                gap: 0.5rem;
            }
        }

        /* ── État de focus accessible ── */
        .btn:focus-visible {
            outline: 2px solid #818cf8;
            outline-offset: 2px;
        }

        /* ── Supprimer les flèches du input number si utilisé ── */
        input[type="text"]::-webkit-outer-spin-button,
        input[type="text"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="text"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <div class="calculator" role="application" aria-label="Calculatrice GO">

        <!-- 🆕 EN-TÊTE : Nom de l'app & Auteur -->
        <div class="app-header">
            <span class="app-name">⬡ Calculatrice GO</span>
            <span class="app-author"><i class="fas fa-code" style="margin-right: 4px; font-size: 0.6rem;"></i> Jimmy</span>
        </div>

        <!-- ÉCRAN -->
        <div class="display" aria-live="polite" aria-atomic="true">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <!-- CLAVIER -->
        <div class="buttons">

            <!-- Ligne 1 -->
            <button class="btn btn-function-clear" data-action="clear" aria-label="Effacer tout">
                <i class="fas fa-delete-left" style="font-size:1.1rem;"></i>
            </button>
            <button class="btn btn-function" data-action="backspace" aria-label="Effacer le dernier caractère">
                <i class="fas fa-arrow-left" style="font-size:1.1rem;"></i>
            </button>
            <button class="btn btn-percent" data-action="percent" aria-label="Pourcentage">%</button>
            <button class="btn btn-operator" data-action="operator" data-value="÷">÷</button>

            <!-- Ligne 2 -->
            <button class="btn btn-number" data-action="number" data-value="7">7</button>
            <button class="btn btn-number" data-action="number" data-value="8">8</button>
            <button class="btn btn-number" data-action="number" data-value="9">9</button>
            <button class="btn btn-operator" data-action="operator" data-value="×">×</button>

            <!-- Ligne 3 -->
            <button class="btn btn-number" data-action="number" data-value="4">4</button>
            <button class="btn btn-number" data-action="number" data-value="5">5</button>
            <button class="btn btn-number" data-action="number" data-value="6">6</button>
            <button class="btn btn-operator" data-action="operator" data-value="−">−</button>

            <!-- Ligne 4 -->
            <button class="btn btn-number" data-action="number" data-value="1">1</button>
            <button class="btn btn-number" data-action="number" data-value="2">2</button>
            <button class="btn btn-number" data-action="number" data-value="3">3</button>
            <button class="btn btn-operator" data-action="operator" data-value="+">+</button>

            <!-- Ligne 5 -->
            <button class="btn btn-sign" data-action="sign" aria-label="Changer de signe">±</button>
            <button class="btn btn-number btn-zero" data-action="number" data-value="0">0</button>
            <button class="btn btn-dot" data-action="dot" aria-label="Point décimal">.</button>
            <button class="btn btn-equal" data-action="calculate" aria-label="Égal">=</button>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── Éléments DOM ──
            const resultEl = document.getElementById('result');
            const expressionEl = document.getElementById('expression');

            // ── État ──
            let currentInput = '0';
            let previousInput = '';
            let operator = null;
            let shouldResetInput = false;
            let lastAction = null;

            // ── Mise à jour de l'affichage ──
            function updateDisplay() {
                let display = currentInput;
                if (display.length > 14) {
                    resultEl.classList.add('shrink');
                } else {
                    resultEl.classList.remove('shrink');
                }

                resultEl.textContent = display;

                if (operator && previousInput) {
                    const opSymbol = operator === '*' ? '×' :
                        operator === '/' ? '÷' :
                        operator === '+' ? '+' :
                        operator === '-' ? '−' : operator;
                    expressionEl.textContent = `${previousInput} ${opSymbol}`;
                } else {
                    expressionEl.textContent = '';
                }

                if (display.length > 16) {
                    resultEl.classList.add('shrink');
                } else {
                    resultEl.classList.remove('shrink');
                }
            }

            // ── Ajouter un chiffre ──
            function inputNumber(value) {
                if (shouldResetInput) {
                    currentInput = '0';
                    shouldResetInput = false;
                }

                if (currentInput === '0' && value !== '.') {
                    currentInput = value;
                } else {
                    if (value === '.' && currentInput.includes('.')) return;
                    if (currentInput.replace('-', '').replace('.', '').length >= 15) return;
                    currentInput += value;
                }

                lastAction = 'number';
                updateDisplay();
            }

            // ── Opérateur ──
            function handleOperator(op) {
                const current = parseFloat(currentInput);

                if (operator && !shouldResetInput) {
                    const result = compute(parseFloat(previousInput), current, operator);
                    if (result === Infinity || isNaN(result) || !isFinite(result)) {
                        currentInput = 'Erreur';
                        operator = null;
                        previousInput = '';
                        shouldResetInput = true;
                        updateDisplay();
                        return;
                    }
                    currentInput = String(result);
                    previousInput = String(result);
                } else {
                    previousInput = currentInput;
                }

                operator = op;
                shouldResetInput = true;
                lastAction = 'operator';
                updateDisplay();
            }

            // ── Calcul ──
            function compute(a, b, op) {
                switch (op) {
                    case '+':
                        return a + b;
                    case '-':
                        return a - b;
                    case '*':
                        return a * b;
                    case '/':
                        return b !== 0 ? a / b : Infinity;
                    default:
                        return b;
                }
            }

            // ── Égal ──
            function calculate() {
                if (!operator || shouldResetInput) {
                    return;
                }

                const a = parseFloat(previousInput);
                const b = parseFloat(currentInput);

                if (isNaN(a) || isNaN(b)) {
                    currentInput = 'Erreur';
                    operator = null;
                    previousInput = '';
                    shouldResetInput = true;
                    updateDisplay();
                    return;
                }

                const result = compute(a, b, operator);

                if (result === Infinity || isNaN(result) || !isFinite(result)) {
                    currentInput = 'Erreur';
                    operator = null;
                    previousInput = '';
                    shouldResetInput = true;
                    updateDisplay();
                    return;
                }

                let resultStr = String(result);
                if (resultStr.length > 16) {
                    if (Number.isFinite(result)) {
                        const fixed = result.toPrecision(12);
                        resultStr = String(parseFloat(fixed));
                    }
                }

                currentInput = resultStr;
                previousInput = '';
                operator = null;
                shouldResetInput = true;
                lastAction = 'calculate';
                updateDisplay();
            }

            // ── Effacer tout ──
            function clearAll() {
                currentInput = '0';
                previousInput = '';
                operator = null;
                shouldResetInput = false;
                lastAction = 'clear';
                updateDisplay();
            }

            // ── Effacer dernier caractère ──
            function backspace() {
                if (shouldResetInput) return;
                if (currentInput.length <= 1) {
                    currentInput = '0';
                } else {
                    currentInput = currentInput.slice(0, -1);
                }
                lastAction = 'backspace';
                updateDisplay();
            }

            // ── Changer de signe ──
            function toggleSign() {
                if (shouldResetInput) return;
                if (currentInput === '0') return;
                if (currentInput.startsWith('-')) {
                    currentInput = currentInput.slice(1);
                } else {
                    currentInput = '-' + currentInput;
                }
                lastAction = 'sign';
                updateDisplay();
            }

            // ── Pourcentage ──
            function percent() {
                const num = parseFloat(currentInput);
                if (isNaN(num)) return;
                const result = num / 100;
                currentInput = String(result);
                shouldResetInput = true;
                lastAction = 'percent';
                updateDisplay();
            }

            // ── Gestion des clics ──
            document.querySelector('.buttons').addEventListener('click', function(e) {
                const btn = e.target.closest('.btn');
                if (!btn) return;

                const action = btn.dataset.action;

                if (currentInput === 'Erreur' && action !== 'clear') {
                    if (action === 'clear') {
                        clearAll();
                    }
                    return;
                }

                switch (action) {
                    case 'number':
                        inputNumber(btn.dataset.value);
                        break;
                    case 'operator':
                        handleOperator(btn.dataset.value === '÷' ? '/' :
                            btn.dataset.value === '×' ? '*' :
                            btn.dataset.value === '−' ? '-' :
                            btn.dataset.value === '+' ? '+' : '');
                        break;
                    case 'calculate':
                        calculate();
                        break;
                    case 'clear':
                        clearAll();
                        break;
                    case 'backspace':
                        backspace();
                        break;
                    case 'sign':
                        toggleSign();
                        break;
                    case 'percent':
                        percent();
                        break;
                    case 'dot':
                        inputNumber('.');
                        break;
                    default:
                        break;
                }
            });

            // ── Gestion du clavier physique ──
            document.addEventListener('keydown', function(e) {
                const key = e.key;

                if (key === 'Tab' || key === 'Shift' || key === 'Control' || key === 'Alt' || key === 'Meta') return;

                e.preventDefault();

                if (/^[0-9]$/.test(key)) {
                    inputNumber(key);
                    return;
                }

                if (key === '.') {
                    inputNumber('.');
                    return;
                }

                if (key === '+') { handleOperator('+'); return; }
                if (key === '-') { handleOperator('-'); return; }
                if (key === '*') { handleOperator('*'); return; }
                if (key === '/') { handleOperator('/'); return; }

                if (key === 'Enter' || key === '=') {
                    calculate();
                    return;
                }

                if (key === 'Backspace') {
                    backspace();
                    return;
                }
                if (key === 'Delete' || key === 'Escape') {
                    clearAll();
                    return;
                }

                if (key === '%') {
                    percent();
                    return;
                }
            });

            // ── Initialisation ──
            updateDisplay();
        })();
    </script>

</body>
</html>
